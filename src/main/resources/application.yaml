server:
  port: 8080

spring:
  application:
    name: bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_omx1k5huI}

  cloud:
    gateway:
      routes:
        - id: catalogo
          uri: ${CATALOGO_URL:http://localhost:8081}
          predicates:
            - Path=/api/catalog/**

        - id: shipments
          uri: ${SHIPMENTS_URL:http://localhost:5000}
          predicates:
            - Path=/api/shipments/**

        - id: users
          uri: ${SHIPMENTS_URL:http://localhost:5000}
          predicates:
            - Path=/api/users/**

        - id: report
          uri: ${REPORT_URL:http://localhost:8082}
          predicates:
            - Path=/api/report/**

        - id: messaging
          uri: ${MESSAGING_URL:http://localhost:8084}
          predicates:
            - Path=/api/messaging/**,/api/rabbitmq/**

        - id: operator-shipments
          uri: ${SHIPMENTS_URL:http://localhost:5000}
          predicates:
            - Path=/api/operator/shipments/**

        - id: operator-confirmations
          uri: ${MESSAGING_URL:http://localhost:8084}
          predicates:
            - Path=/api/operator/confirmations/**

app:
  security:
    azure:
      enabled: ${AZURE_ENABLED:false}
      tenant-id: ${AZURE_TENANT_ID:}
      audience: ${AZURE_API_CLIENT_ID:}
      client-id: ${AZURE_SPA_CLIENT_ID:}
      scope: ${AZURE_OPERATOR_SCOPE:operator.access}
      jwk-set-uri: ${AZURE_JWK_SET_URI:}
    cognito:
      client-id: ${COGNITO_CLIENT_ID:41v988atubk0lrcmto285tk77i}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ms-rutaexpress-bff
